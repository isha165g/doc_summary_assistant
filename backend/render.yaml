# Render Blueprint Specification for Document Summary Assistant Backend
# Deploy either as Docker (Recommended for Tesseract OCR) or Native Python

services:
  # Option 1 (Recommended): Docker Service with built-in Tesseract OCR system packages
  - type: web
    name: document-summary-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false # Set securely in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false # e.g., https://your-app.vercel.app
      - key: PYTHONUNBUFFERED
        value: "1"

  # Option 2 (Alternative): Native Python Service (requires apt package build script)
  # - type: web
  #   name: document-summary-api-native
  #   runtime: python
  #   rootDir: backend
  #   buildCommand: "pip install -r requirements.txt"
